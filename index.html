<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Happy Birtday!</title>
    <style>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
        button {
            background-color: #FFA500; /* orange */
            color: #FFFFFF; /* weiß */
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #FF8C00; /* darkorange */
        }

        body {
            background: linear-gradient(to right, #E96443, #904E95); /* #E96443 = e96443, #904E95 = 904e95 */
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            padding: 2rem;
        }

        h1 {
            color: #F5DEB3; /* wheat */
            font-family: Impact, sans-serif;
            font-size: 3rem;
        }

        h2 {
            color: #FFE4B5; /* moccasin */
            font-family: Verdana, sans-serif;
            font-size: 2rem;
            margin-top: 2rem;
            text-decoration: underline; 
        }

        h3 {
            color: #66A6FF; /* königsblau */
            font-family: 'Great Vibes', serif;
            font-size: 1.5rem;
            margin: 0.5rem 0;
        }

        li {
            color: #6A5ACD; /* SlateBlue */
            font-family: 'Brush Script MT', serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        img {
            border-radius: 10px;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        a {
            color: #FFFFE0; /* LightYellow */
            text-decoration: underline;
        }

        a:hover {
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <h1>Alles Gute zum Geburtstag!</h1>
    
    <h3>Liebe Sibylle!</h3>
    <h3>Wir wünschen dir alles Gute zu deinem Geburtstag!</h3>
    <h3>Wir wünschen dir Gesundheit, Freude und Wohlstand!</h3>
    <h2>Bleib so, wie du bist!</h2>
	<img src="p2.jpg" width="250" alt="Foto von Sibylle">
</body>
</html>
